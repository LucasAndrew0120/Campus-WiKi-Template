name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            code/package-lock.json

      - name: Install workspace dependencies
        run: npm ci --include=optional

      - name: Install Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libexpat1 libnspr4 libnss3

      - name: Install XLSX sync dependencies
        working-directory: code
        run: npm ci --ignore-scripts

      - name: Restore XLSX cache
        uses: actions/cache@v6
        with:
          path: docs/.http_cache
          key: xlsx-${{ runner.os }}-${{ hashFiles('docs/**/*.md') }}
          restore-keys: xlsx-${{ runner.os }}-

      - name: Sync Tencent documents
        env:
          CACHE_DIR: ${{ github.workspace }}/docs/.http_cache
          DOC_URL: ${{ vars.DOC_URL }}
          DOC_URLS: ${{ vars.DOC_URLS }}
        run: node code/qutwiki-sync.mjs --docs docs

      - name: Build documentation site
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
